name: ci
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[faker]" pytest
      - run: pytest -q

  package:
    # Build the WHEEL and run it from a clean install — not editable source. This is the check that would
    # have caught 0.2.0 shipping without rlsautotest.strategies. Tests the artifact users actually get.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install the built wheel into a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          # cd OUTSIDE the source tree so the INSTALLED package is imported, not ./rlsautotest
          cd /tmp
          /tmp/clean/bin/rlsautotest --help
          /tmp/clean/bin/python -c "import rlsautotest.cli, rlsautotest.emit, rlsautotest.strategies, rlsautotest.multi; print('clean-install import OK')"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          PGVER=$(pg_lsclusters -h | awk '{print $1; exit}')
          sudo apt-get install -y "postgresql-${PGVER}-pgtap" || sudo apt-get install -y pgtap || true
          sudo pg_ctlcluster "${PGVER}" main start || sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb app
          sudo -u postgres psql -d app -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Generate and run the RLS suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # load the example schemas that are expected to be green (owner-scoped + multi-tenant).
          # exotic.sql is intentionally NOT loaded here: it contains a deliberately broken policy to
          # demonstrate detection, so it is meant to fail the gate, not pass it.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/tenancy.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/rbac.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/rbac_tenant.sql # multi-tenant RBAC patterns: login-only INSERT + ownership trigger, multi-col unique + text[], array-cardinality CHECK, composite FK + FOR ALL w/o UPDATE grant + service_role USING(true) -> all must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/clearance.sql   # numeric-threshold; only the general solver can test it
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/synth.sql       # opaque-fn gate + composite FK + CHECK-UDF; only the probe-and-repair synthesizer can seed it
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/adversarial.sql # novel atoms OR'd with a classifiable branch; the per-min-term solver (BL-1) must DB-verify the novel branch
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/mockforce.sql   # opaque scalar fn in a comparison (fn()=const, fn()=fn()) -> force-mock wiring proof, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_himed.sql # bool col / NOT / IS TRUE / JSONB @>,? / BETWEEN / lower()/cast / cross-col -> all solver-tested, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_array.sql # WB-1: array overlap/containment (&&, @>, <@, reverse-order) -> solver-tested, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_fncol2.sql # WB-2: many-to-one fn-on-col (date_trunc/substring/left/to_char) preimage -> solver-tested, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_subq.sql  # WB-3: non-canonical subqueries (extra cond / two correlations / IN / NOT EXISTS) -> general subquery solver, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_novel.sql # BL-6: construct-first DB-oracle floor (starts_with / `%` / a CUSTOM operator) -> solved with ZERO operator-specific code, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_joint.sql # BL-11: joint signature search (two-column custom op + a claim under a custom op) -> session x multi-column search, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_cardinality.sql # BL-12: relational-state floor (count(*) >= K cardinality gate) -> seeds K rows + lets the DB evaluate the aggregate, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/recursion.sql # VALID self-referential hierarchy (WITH RECURSIVE from owner=auth.uid(), read via a SECURITY DEFINER fn so RLS is not re-entered -> no 42P17) -> exercises the recursion strategy (synth_recursion_emit) on a GREEN path, must stay green. The broken counterpart lives in exotic.folders (excluded above).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/exotic_types.sql # F3: NOT NULL columns of exotic types (inet/macaddr/bytea/DOMAIN) that the static value table cannot represent -> seeded by the DB-oracle _castable_lit; before F3 the row could not be built and the branch went UNRELIABLE, must stay green. Also xtypes.sensors: the same exotic types on a CLASSIFIED (owner-scoped) table -> the oracle-verified fill seeds it and the UPDATE probe SETs a castable value, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/zeroarg.sql # F10: a ZERO-arg boolean fn whose body is a transparent JWT-claim check (is_admin()) -> introspected to a claim_const atom and tested FOR REAL (no [mocked; wiring] tags), must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/regexfree.sql # F6: a policy whose WITH CHECK contains a column NAME inside a string literal -> the AST (not a text regex) decides which columns the policy references, so the real neutral column stays SETtable and UPDATE is tested, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/customrole.sql # F5: policies granted TO a custom role (reporter) -> probed via SET ROLE and shown as their own report row instead of silently vanishing from the client DNF, must stay green
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/quoted_idents.sql # #357 GUARD: PascalCase (quoted) table + columns with GUC tenancy -> the generator must QUOTE every identifier it emits, else seeds die 42703/undefined_table and every cell goes UNRELIABLE. Must stay green.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/seedfail.sql # seedfail is now GREEN: the checkwitness feature seeds its ten-digit format CHECK by construction (the stable un-seedable negative moved to seedimpossible.sql)
          rc=0
          for schema in public tenancy rbac rbt clearance synth adversarial mockforce wm wa wf2 wsq wn wj wcard recursion xtypes za rxf crole qident seedfail; do
            echo "===== schema: $schema ====="
            rlsautotest --db-url "$DATABASE_URL" --schema "$schema" --emit "out_$schema"
            for f in "out_$schema"/tests/database/rls/*.sql; do
              echo "== $f =="
              psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -f "$f" | tee /tmp/tap.txt
              grep -q '^ *not ok' /tmp/tap.txt && rc=1 || true
            done
            # Enforce the gate on the green set: a NEW hole, a cross-policy leak, or an UNRELIABLE cell
            # (a test whose seed/precondition silently stopped working) must fail CI here. This is the
            # coverage-regression guard -- the pg_prove loop above only catches 'not ok', not a cell that
            # silently dropped to "– not tested".
            rlsautotest --db-url "$DATABASE_URL" --schema "$schema" --report || rc=1
          done
          # BL-1 guard: the per-min-term solver must DB-verify the novel OR-branches in adversarial.sql
          # (e.g. `status <> 'deleted'`, `deleted_at IS NULL`). If the solver gets re-gated/regressed, these
          # [solver] tests vanish and the novel branch is silently dropped — fail CI if they're missing.
          grep -rq '\[solver\]' out_adversarial/tests/database/rls/ || { echo "FAIL: BL-1 produced no [solver] tests for adversarial — the novel branches were dropped"; rc=1; }
          rlsautotest --db-url "$DATABASE_URL" --schema adversarial --debug-unhandled   # show the classifier gaps for the record
          exit $rc
      - name: Catch the cross-policy WITH CHECK leak (examples/transitions.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # transitions.sql is a DELIBERATE leak (like exotic.sql): a role-gated status state machine
          # whose permissive UPDATE policies' WITH CHECK clauses OR-combine so a role can write a status
          # its own policy forbids. The gate MUST flag it (exit non-zero) — failing to is a regression
          # in either identity derivation (gap 1) or the transition audit (gap 2).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/transitions.sql
          if rlsautotest --db-url "$DATABASE_URL" --schema transitions --report; then
            echo "FAIL: did NOT catch the known cross-policy WITH CHECK leak in transitions.work_items"
            exit 1
          fi
          echo "OK: cross-policy WITH CHECK leak detected (gate exited non-zero) as expected"
      - name: Flag an un-seedable table as UNRELIABLE, never a silent pass (examples/seedimpossible.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # seedimpossible.sql is DELIBERATELY un-seedable (a CHECK (false) contradiction no value can EVER
          # satisfy, so it can never "solve itself" as the value constructor improves).
          # The engine must mark those cells UNRELIABLE and FAIL the gate (exit non-zero) rather than print
          # "– not tested" or bake the seed error as a policy denial. Failing to is a regression in the
          # probe's arrange/act split or the post-arrange invariant.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/seedimpossible.sql
          # Capture the gate's REAL exit code without a pipe (a `... | tee file` pipeline reports tee's
          # exit 0 and MASKS the gate's non-zero exit) AND without tripping `set -e` (a bare
          # `cmd; rc=$?` aborts the step on the gate's expected exit 1 before rc is read). `|| rc=$?` is
          # exempt from set -e and records the real code; works under sh -e and bash -eo pipefail.
          rc=0
          rlsautotest --db-url "$DATABASE_URL" --schema seedimpossible --report > /tmp/sf.txt 2>&1 || rc=$?
          cat /tmp/sf.txt
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: an un-seedable table did NOT fail the gate"
            exit 1
          fi
          grep -q "UNRELIABLE" /tmp/sf.txt || { echo "FAIL: expected an UNRELIABLE call-out"; exit 1; }
          echo "OK: un-seedable table flagged UNRELIABLE and gated as expected"
      - name: UPDATE probe correctness - neutral col / valid value / explained dash (examples/updcheck.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # updcheck stresses the UPDATE probe's SET-a-neutral-column path: t1 (value-set CHECK -> valid value
          # -> green), t2 (a format CHECK the checkwitness seeder now satisfies BY CONSTRUCTION, so the UPDATE is
          # really probed and is GREEN -- same story as seedfail; the stable un-seedable negative lives in
          # seedimpossible.sql / CHECK(false)), t3 (self-assign fallback -> green), t4 (no neutral column AND
          # nothing self-assignable -> explained '-' coverage gap, never a silent pass). So the gate stays GREEN
          # (exit 0) and the t4 no-neutral-column note must still appear.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/updcheck.sql
          rc=0
          rlsautotest --db-url "$DATABASE_URL" --schema updcheck --report > /tmp/uc.txt 2>&1 || rc=$?
          cat /tmp/uc.txt
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: updcheck should be GREEN (checkwitness seeds t2's format CHECK by construction) but the gate exited $rc"
            exit 1
          fi
          grep -q "no policy-neutral column" /tmp/uc.txt || { echo "FAIL: expected the explained '-' note (t4: no policy-neutral column to modify)"; exit 1; }
          echo "OK: UPDATE probe correctness held (t1/t2/t3 green with valid SET values, t4 no-neutral-column dash explained)"
      - name: Implicit-deny (--implicit-deny) governs the full command matrix (examples/witness_himed.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # wm tables are SELECT-only policies, so INSERT/UPDATE/DELETE are RLS deny-by-default. With
          # --implicit-deny the emitted suite must ADD passing deny tests for those no-policy commands (full
          # command-matrix governance). Assert the deny tests appear AND the suite stays green (no 'not ok').
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/witness_himed.sql
          rlsautotest --db-url "$DATABASE_URL" --schema wm --emit out_wm_idn --implicit-deny
          found=0; rc=0
          for f in out_wm_idn/tests/database/rls/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -f "$f" > /tmp/idn.tap 2>&1 || true
            grep -q '^ *not ok' /tmp/idn.tap && rc=1 || true
            grep -q 'implicit deny' /tmp/idn.tap && found=1 || true
          done
          if [ "$found" -ne 1 ]; then echo "FAIL: --implicit-deny emitted no deny tests"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "FAIL: implicit-deny suite had a failing test"; exit 1; fi
          echo "OK: --implicit-deny added passing deny tests for no-policy commands"
      - name: Bypass-surface lint flags the side doors (examples/bypass.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # bypass.sql has real side doors (a definer view, a matview, anon-callable SECURITY DEFINER fns incl. one
          # with a mutable search_path) plus safe objects (a security_invoker view, an unreachable view, an
          # EXECUTE-revoked helper, and a definer view/fn over a NON-RLS table). lint must flag the doors with the
          # right severity and leave the safe ones alone. The internal L0xx codes are shown in no output now, so this
          # asserts via --json on object + severity (with jq) and checks that no code leaks into any output.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/bypass.sql
          text=$(rlsautotest lint --schema bypasssurf --db-url "$DATABASE_URL" --json /tmp/bypass.json 2>&1 || true)
          echo "$text"
          echo "$text" | grep -Eq '\bL0[0-9][0-9][a-z]?\b' && { echo "FAIL: a lint code leaked into text output"; exit 1; } || true
          j=/tmp/bypass.json
          has(){ jq -e --arg t "$1" --arg s "$2" 'any(.[]; .table==$t and .severity==$s)' "$j" >/dev/null; }
          has leaky_secrets CRITICAL || { echo "FAIL: leaky definer view not CRITICAL"; exit 1; }
          has mv_secrets    CRITICAL || { echo "FAIL: materialized-view leak not CRITICAL"; exit 1; }
          has auth_secrets  HIGH     || { echo "FAIL: authenticated-only definer view not HIGH"; exit 1; }
          jq -e 'any(.[]; (.table|startswith("all_secrets(")) and .severity=="CRITICAL")' "$j" >/dev/null || { echo "FAIL: anon-callable SECURITY DEFINER fn reading RLS not CRITICAL"; exit 1; }
          jq -e 'any(.[]; (.message|test("search_path")) and .severity=="HIGH")' "$j" >/dev/null || { echo "FAIL: mutable-search_path fn not HIGH"; exit 1; }
          jq -e 'any(.[]; has("rule") or has("code"))' "$j" >/dev/null && { echo "FAIL: a code field leaked into lint JSON"; exit 1; } || true
          for safe in safe_secrets internal_secrets internal_helper menu_view menu_count; do
            jq -e --arg t "$safe" 'any(.[]; .table==$t)' "$j" >/dev/null && { echo "FAIL: safe object $safe wrongly flagged"; exit 1; } || true
          done
          echo "OK: bypass-surface lint flagged the doors with correct severity and left the safe objects alone (codes hidden)"
      - name: Supabase mode - nested layout, reconcile, no probe warning (issue #3)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # --supabase writes into <root>/supabase/tests/rls with a _rlsautotest.sql suffix, prunes its own
          # stale output on re-run, never touches hand-written tests, and prints no probe warning (it binds
          # to the local disposable stack). Driven with --db-url so no supabase CLI/stack is needed; the
          # `public` schema (examples/schema.sql) was loaded above and persists in the job's Postgres.
          proj=$(mktemp -d)
          mkdir -p "$proj/supabase/tests/rls"
          printf 'project_id = "ci-test"\n[db]\nport = 54322\n' > "$proj/supabase/config.toml"
          echo '-- hand-written, must survive'      > "$proj/supabase/tests/rls/keepme.test.sql"
          echo '-- stale generated, must be pruned'  > "$proj/supabase/tests/rls/999-rls-ghost_rlsautotest.sql"
          cd "$proj"
          rlsautotest --supabase --schema public --db-url "$DATABASE_URL" >/tmp/sb.out 2>/tmp/sb.err \
            || { echo "FAIL: --supabase exited non-zero"; cat /tmp/sb.err; exit 1; }
          cat /tmp/sb.out
          if grep -q "WARNING: rlsautotest runs statements" /tmp/sb.err; then
            echo "FAIL: probe warning printed in --supabase mode"; exit 1; fi
          ls supabase/tests/rls/*_rlsautotest.sql >/dev/null 2>&1 \
            || { echo "FAIL: no *_rlsautotest.sql emitted into supabase/tests/rls"; exit 1; }
          if [ -f supabase/tests/rls/999-rls-ghost_rlsautotest.sql ]; then
            echo "FAIL: stale orphan not pruned"; exit 1; fi
          [ -f supabase/tests/rls/keepme.test.sql ] \
            || { echo "FAIL: hand-written test removed by reconcile"; exit 1; }
          rc=0
          for f in supabase/tests/rls/*_rlsautotest.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -f "$f" > /tmp/sbtap.txt 2>&1 || true
            grep -q '^ *not ok' /tmp/sbtap.txt && rc=1 || true
          done
          [ "$rc" -eq 0 ] || { echo "FAIL: an emitted --supabase test failed"; exit 1; }
          echo "OK: --supabase nested layout + reconcile + no-warning all verified"
          # --all-schemas composes with --supabase: bind to the local Supabase DB, write the combined
          # dashboard, and emit NO test files (it is the read-only report path, not the emit path).
          before=$(ls supabase/tests/rls | wc -l)
          rlsautotest --supabase --all-schemas --html /tmp/sb_all.html --db-url "$DATABASE_URL" --no-fail > /tmp/sball.out 2>&1 \
            || { echo "FAIL: --supabase --all-schemas exited non-zero"; cat /tmp/sball.out; exit 1; }
          grep -q 'const REPORTS' /tmp/sb_all.html || { echo "FAIL: --supabase --all-schemas wrote no dashboard"; exit 1; }
          if grep -q "WARNING: rlsautotest runs statements" /tmp/sball.out; then echo "FAIL: probe warning printed in --supabase --all-schemas mode"; exit 1; fi
          after=$(ls supabase/tests/rls | wc -l)
          [ "$before" -eq "$after" ] || { echo "FAIL: --all-schemas dashboard emitted test files into the project"; exit 1; }
          echo "OK: --supabase --all-schemas built the combined dashboard from the local DB and wrote no test files"
      - name: --all-schemas builds one combined dashboard and aggregates the gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/app
        run: |
          # By now the job's app DB holds the whole example corpus: the ~22 green schemas PLUS the
          # deliberately-bad ones earlier steps loaded (transitions = cross-policy WITH CHECK leak,
          # seedimpossible = un-seedable / UNRELIABLE). --all-schemas must (a) discover every RLS-bearing
          # schema and embed each one's EXACT single-schema report into ONE combined HTML, and (b) aggregate
          # the CI gate across all of them: with bad schemas present the gate MUST fail, --no-fail suppresses it.
          rlsautotest --db-url "$DATABASE_URL" --all-schemas --html /tmp/all.html --no-fail > /tmp/all.out 2>&1 \
            || { echo "FAIL: --all-schemas --no-fail should exit 0"; cat /tmp/all.out; exit 1; }
          cat /tmp/all.out
          grep -q 'const REPORTS' /tmp/all.html || { echo "FAIL: combined HTML embedded no reports"; exit 1; }
          buttons=$(grep -o 'class="item"' /tmp/all.html | wc -l)
          echo "discovered schemas (picker buttons): $buttons"
          [ "$buttons" -ge 20 ] || { echo "FAIL: expected >=20 schemas in the dashboard, got $buttons"; exit 1; }
          grep -q 'data-s="rbac"' /tmp/all.html || { echo "FAIL: green schema rbac missing from the dashboard"; exit 1; }
          grep -q 'data-s="transitions"' /tmp/all.html || { echo "FAIL: leaking schema transitions missing from the dashboard"; exit 1; }
          python -c "import sys; sys.exit(1 if '\u2014' in open('/tmp/all.html', encoding='utf-8').read() else 0)" \
            || { echo "FAIL: an em-dash leaked into the combined report"; exit 1; }
          # The embedded per-schema report must be BYTE-IDENTICAL to a standalone single-schema run: the
          # dashboard is a faithful container, it never alters the report it wraps.
          rlsautotest --db-url "$DATABASE_URL" --schema rbac --html /tmp/rbac_single.html --no-fail > /dev/null 2>&1
          python -c "import base64,json,re,sys; d=open('/tmp/all.html',encoding='utf-8').read(); r=json.loads(re.search(r'const REPORTS = (\{.*\});',d).group(1)); emb=base64.b64decode(r['rbac']).decode('utf-8'); s=open('/tmp/rbac_single.html',encoding='utf-8').read(); print('OK: embedded rbac == standalone rbac' if emb==s else 'FAIL: embedded rbac differs from standalone'); sys.exit(0 if emb==s else 1)"
          # Without --no-fail the aggregate gate MUST fail because transitions leaks and seedimpossible is UNRELIABLE.
          rc=0
          rlsautotest --db-url "$DATABASE_URL" --all-schemas --report > /tmp/allg.txt 2>&1 || rc=$?
          cat /tmp/allg.txt
          [ "$rc" -ne 0 ] || { echo "FAIL: aggregate gate did not fail with known-bad schemas present"; exit 1; }
          grep -q 'transitions\.' /tmp/allg.txt || { echo "FAIL: aggregate gate did not name the leaking transitions table"; exit 1; }
          echo "OK: --all-schemas combined dashboard + aggregate gate verified (suppressed by --no-fail, fails without it)"
